trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

variables:
  imageRepository: 'nopcommerce'
  containerRegistry: '$(ACR_LOGIN_SERVER)'
  dockerfilePath: 'Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:

# ── Stage 1: Build & Test ─────────────────────────────────────────────────────
- stage: Build
  displayName: Build and Test
  jobs:
  - job: BuildTest
    displayName: Build & Test
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: UseDotNet@2
      displayName: Use .NET 10
      inputs:
        packageType: sdk
        version: '10.0.x'

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: 'src/NopCommerce.sln'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: 'src/NopCommerce.sln'
        arguments: '--no-restore --configuration Release'

    - task: DotNetCoreCLI@2
      displayName: Test
      inputs:
        command: test
        projects: 'src/Tests/**/*.csproj'
        arguments: '--no-build --configuration Release --verbosity normal'

# ── Stage 2: Docker Build & Push ─────────────────────────────────────────────
- stage: Docker
  displayName: Docker Build and Push
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - job: DockerBuildPush
    displayName: Build & Push Image
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push image to ACR
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: '$(ACR_SERVICE_CONNECTION)'
        tags: |
          latest

# ── Stage 3: Deploy to Azure App Service ─────────────────────────────────────
- stage: Deploy
  displayName: Deploy to Azure App Service
  dependsOn: Docker
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - deployment: DeployWeb
    displayName: Deploy to App Service
    pool:
      vmImage: $(vmImageName)
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy container to App Service
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              appName: '$(APP_SERVICE_NAME)'
              containers: '$(containerRegistry)/$(imageRepository):latest'
