services:
  nopcommerce_web:
    build: .
    container_name: nopcommerce
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    volumes:
      - nopcommerce_app_data:/app/App_Data
      - nopcommerce_images:/app/wwwroot/images
    depends_on:
      nopcommerce_database:
        condition: service_healthy

  nopcommerce_database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nopcommerce_mssql
    environment:
      SA_PASSWORD: "${MSSQL_SA_PASSWORD:-nopCommerce_db_P@ssw0rd}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1434:1433"
    volumes:
      - nopcommerce_mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD:-nopCommerce_db_P@ssw0rd}", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  nopcommerce_app_data:
  nopcommerce_images:
  nopcommerce_mssql_data:
